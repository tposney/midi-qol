variables:
  PACKAGE_NAME: midi-qol
  PACKAGE_ARCHIVE: $PACKAGE_NAME-$CI_COMMIT_TAG
  PACKAGE_REGISTRY_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME
  PACKAGE_REGISTRY_URL_FULL: $PACKAGE_REGISTRY_URL/$CI_COMMIT_TAG
  PACKAGE_TYPE: module
  FOUNDRY_RELEASE_URL: https://foundryvtt.com/_api/packages/release_version/

stages:
  - prepare-release
  - release
  - publish
  - foundry

publish-artifacts:
  stage: prepare-release
  image: curlimages/curl:latest
  script:
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file package/$PACKAGE_TYPE.json "${PACKAGE_REGISTRY_URL_FULL}/${PACKAGE_TYPE}.json"'
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file package/$PACKAGE_ARCHIVE.zip "${PACKAGE_REGISTRY_URL_FULL}/${PACKAGE_ARCHIVE}.zip"'
  rules:
    - if: $CI_COMMIT_TAG

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  script:
    - echo "running release_job"
    - grep -B 999 -m2 "^### " Changelog.md | head -n -1 > this_changelog
  release:                               # See https://docs.gitlab.com/ee/ci/yaml/#release for available properties
    tag_name: '$CI_COMMIT_TAG'
    description: this_changelog
    assets:
      links:
        - name: '$PACKAGE_ARCHIVE.zip'
          url: "${PACKAGE_REGISTRY_URL_FULL}/${PACKAGE_ARCHIVE}.zip"
          filepath: '/$PACKAGE_ARCHIVE.zip'
        - name: '$PACKAGE_TYPE.json'
          url: "${PACKAGE_REGISTRY_URL_FULL}/${PACKAGE_TYPE}.json"
          filepath: '/$PACKAGE_TYPE.json'

publish-foundry-manifest:
  stage: foundry
  needs: [pages]
  when: manual
  image: node:latest
  before_script:
    - apt-get -qq update
    - apt-get install -y jq
  script: |
      RESPONSE=$(curl -X POST -H "Content-Type: application/json" -H "Authorization: $FOUNDRY_API_TOKEN" $FOUNDRY_RELEASE_URL -d \
      "{
        \"id\": \"$PACKAGE_NAME\",
        \"release\": {
          \"version\": \"${CI_COMMIT_TAG:1}\",
          \"manifest\": \"$CI_PAGES_URL/versions/${CI_COMMIT_TAG:1}/$PACKAGE_TYPE.json\",
          \"notes\": \"$CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG\",
          \"compatibility\": $(jq .compatibility package/$PACKAGE_TYPE.json)
        }
      }")
      echo $RESPONSE
  rules:
    - if: $CI_COMMIT_TAG

# Update files for Foundry, served from GitLab Pages (limited per visitor, not per file like raw repository files):
# <pages url>/<line>/module.json, the zip it names and changelog.html, for each release line's branch head; and
# versions/<version>/module.json with its zip for each release tag whose manifest is on Pages (foundryvtt.com's
# version entries); plus an index page. GitLab replaces the whole site on each deployment, so everything is rebuilt.
# Runs on a release tag, by hand (Run pipeline) or by trigger token.
pages:
  stage: publish
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
    RELEASE_LINES: "v13 v14 dnd6"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "trigger"
  script:
    - apk add --no-cache git jq cmark
    - |
      set -e
      mkdir -p public
      lines_html=""
      for line in $RELEASE_LINES; do
        git fetch --quiet origin "+refs/heads/$line:refs/remotes/origin/$line"
        git show "origin/$line:package/$PACKAGE_TYPE.json" > manifest.json
        version=$(jq -r .version manifest.json)
        zip=$(basename "$(jq -r .download manifest.json)")
        mkdir -p "public/$line"
        git show "origin/$line:package/$zip" > "public/$line/$zip"
        changelog=""
        for f in Changelog.md CHANGELOG.md changelog.md; do
          if git cat-file -e "origin/$line:$f" 2>/dev/null; then
            {
              printf '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">\n'
              printf '<title>%s %s changelog</title>\n' "$PACKAGE_NAME" "$line"
              printf '<style>:root{color-scheme:light dark}body{font:16px/1.5 system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:0 1rem}code{font-size:.9em}</style>\n'
              printf '</head><body>\n'
              git show "origin/$line:$f" | cmark
              printf '</body></html>\n'
            } > "public/$line/changelog.html"
            changelog="$CI_PAGES_URL/$line/changelog.html"
            break
          fi
        done
        jq --arg manifest "$CI_PAGES_URL/$line/$PACKAGE_TYPE.json" --arg download "$CI_PAGES_URL/$line/$zip" --arg changelog "$changelog" \
          '.manifest = $manifest | .download = $download | if $changelog != "" then .changelog = $changelog else . end' \
          manifest.json > "public/$line/$PACKAGE_TYPE.json"
        lines_html="$lines_html<li><strong>$line</strong> $version: <a href=\"$line/$PACKAGE_TYPE.json\">manifest</a>${changelog:+, <a href=\"$line/changelog.html\">changelog</a>}</li>"
        echo "$line: $version $zip${changelog:+ (changelog)}"
      done
      # Each release whose manifest is on Pages also keeps its own manifest and zip, for foundryvtt.com's version entries
      git fetch --quiet --tags origin
      versions_html=""
      for tag in $(git tag --list 'v*' --sort=-creatordate); do
        git cat-file -e "$tag:package/$PACKAGE_TYPE.json" 2>/dev/null || continue
        git show "$tag:package/$PACKAGE_TYPE.json" > tag-manifest.json
        tag_manifest=$(jq -r .manifest tag-manifest.json 2>/dev/null) || continue
        case "$tag_manifest" in "$CI_PAGES_URL"/*) ;; *) continue ;; esac
        version=$(jq -r .version tag-manifest.json)
        zip=$(basename "$(jq -r .download tag-manifest.json)")
        git cat-file -e "$tag:package/$zip" 2>/dev/null || { echo "$tag: no package/$zip, skipped"; continue; }
        mkdir -p "public/versions/$version"
        git show "$tag:package/$zip" > "public/versions/$version/$zip"
        jq --arg download "$CI_PAGES_URL/versions/$version/$zip" --arg changelog "${tag_manifest%/*}/changelog.html" \
          '.download = $download | .changelog = $changelog' tag-manifest.json > "public/versions/$version/$PACKAGE_TYPE.json"
        versions_html="$versions_html<li><a href=\"versions/$version/$PACKAGE_TYPE.json\">$version</a></li>"
        echo "versions/$version: $zip"
      done
      {
        printf '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">\n'
        printf '<title>%s</title><style>:root{color-scheme:light dark}body{font:16px/1.5 system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:0 1rem}</style>\n' "$PACKAGE_NAME"
        printf '</head><body><h1>%s</h1><p>Install or update in Foundry with the manifest URL of your release line.</p><ul>%s</ul><h2>Versions</h2><p>Each release'"'"'s own manifest (for installing that version):</p><ul>%s</ul></body></html>\n' "$PACKAGE_NAME" "$lines_html" "$versions_html"
      } > public/index.html
  artifacts:
    paths:
      - public
