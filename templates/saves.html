<div data-item-id="{{itemId}}">
<div class="midi-qol-save-heading">
  <strong>{{{saveDisplayFlavor}}}</strong>
</div>
{{#if hasDamageText}}
<div class="midi-qol-save-heading">
  <strong>
    {{{fullDamageText}}} {{{halfDamageText}}} {{{noDamageText}}}
  </strong>
</div>
{{/if}}
<ul class="dnd5e2 unlist evaluation wrapper">
  {{#each saves as |save iid|}}
  <li class="midi-qol midi-qol-save-class target midi-qol-target-select {{save.targetClass}} {{save.saveClass}}" data-id="{{save.target.id}}">
    <i class="fas {{save.saveSymbol}}"></i>
    <img class="midi-qol-save-img" src="{{save.img}}" />
    <div class="midi-qol-target-name midi-qol-save-name" id="{{save.target.id}}" data-uuid="{{save.target.document.uuid}}" data-tooltip-html="{{{save.attributionTooltip}}}" data-tooltip-direction="UP">
      <div class="name-stacked">
        <span class="midi-qol-target-name title" id="save.target.id">{{save.gmName}}</span>
      </div>
    </div>
    <div class="midi-qol-save-indicators">
      {{#if save.hasAttribution}}
      <span class="midi-save-attribution-info {{save.saveTotalClass}}" data-tooltip-html="{{{save.attributionTooltip}}}" data-tooltip-direction="DOWN"><i class="fas fa-info-circle"></i></span>
      {{/if}}
      {{#if save.coverLabel}}<dnd5e-icon class="midi-qol-ac-icon" src="{{save.coverLabel}}"></dnd5e-icon>{{/if}}
      <span class="{{save.saveTotalClass}} midi-qol-tooltip midi-qol-save-total" {{#if save.saveTooltip}}data-tooltip="{{save.saveTooltip}}"{{/if}}>
        {{save.rollTotal}}
        <span class="midi-qol-tooltiptext midi-qol-save-tooltip {{save.saveToolTipClass}}">
          {{{save.rollHTML}}}
        </span>
      </span>
    </div>
  </li>
  {{/each}}
</ul>
</div>
