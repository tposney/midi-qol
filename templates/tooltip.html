{{#if parts.length}}
<div class="dice-tooltip-collapser">
  <div class="dice-tooltip">
    {{> "modules/midi-qol/templates/tooltip-extras.html"}}
    {{#each parts}}
    <section class="tooltip-part">
      <div class="dice">
        <ol class="dice-rolls">
          {{#each rolls}}
          <li class="roll {{ classes }}">{{{ result }}}</li>
          {{/each}}
          {{#if constant}}
          <li class="constant"><span class="sign">{{ constant.sign }}</span>{{ constant.value }}</li>
          {{/if}}
        </ol>
        <div class="total">
          <span class="label">{{ flavor }}</span>
          <span class="value">{{ total }}</span>
        </div>
      </div>
    </section>
    {{/each}}
  </div>
</div>
{{/if}}
